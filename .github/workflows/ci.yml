name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl curl iproute2
      - run: sudo bash tests/deployment-smoke.sh
      - name: Verify release package manifest checks
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          printf '%040d\n' 0 >"$fixture/DIGITALPANCAKE_RELEASE"
          printf 'verified-content\n' >"$fixture/source.txt"
          (cd "$fixture" && sha256sum DIGITALPANCAKE_RELEASE source.txt >DIGITALPANCAKE_SHA256SUMS)
          bash tests/package-smoke.sh "$fixture"
          printf 'tampered\n' >>"$fixture/source.txt"
          if bash tests/package-smoke.sh "$fixture"; then
            echo 'tampered package was accepted' >&2
            exit 1
          fi

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run validate:content
      - run: npm run test:api
      - run: npm run test:integration
      - run: npm run test:announcement
      - run: npm run test:profile-community
      - run: npm run test:persistence
      - run: npm run test:mail
      - run: npm run test:owner-recovery
      - run: npm run test:e2e
      - run: npm run test:community
      - name: Browser UI regressions
        run: |
          npm run preview > /tmp/electronic-pancake-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          PREVIEW_BASE=http://127.0.0.1:4173 npm run test:ui
          PREVIEW_BASE=http://127.0.0.1:4173 npm run test:new-features-ui
