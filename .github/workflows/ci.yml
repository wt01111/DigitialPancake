name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl curl iproute2
      - run: sudo bash tests/deployment-smoke.sh

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run validate:content
      - run: npm run test:api
      - run: npm run test:persistence
      - run: npm run test:mail
      - run: npm run test:e2e
      - run: npm run test:community
