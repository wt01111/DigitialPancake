# Replace example.com with the one canonical hostname used by PUBLIC_ORIGIN.
# This optional alias block prevents www and the canonical host from becoming
# two different browser origins. Delete it when no www DNS alias is used.
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;
    return 308 https://example.com$request_uri;
}

# Certbot adds the TLS certificate paths after DNS points at this server. When
# the www alias is retained, request one certificate containing both names so
# HTTPS requests to www can be redirected without a certificate warning.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /opt/electronic-pancake/current/dist;
    index index.html;
    access_log /var/log/nginx/electronic-pancake.access.log;
    error_log /var/log/nginx/electronic-pancake.error.log warn;

    # 50 MiB attachments plus multipart framing; the API still enforces its own limit.
    client_max_body_size 52m;
    client_body_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
    }

    # Never map /var/lib/electronic-pancake/uploads as a static directory.
    # Private attachments must be returned by an authenticated API route.
    location /uploads/ { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
